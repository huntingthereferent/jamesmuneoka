<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190" role="img" aria-label="Full-state conjugacy equations"><title>Full-state conjugacy equations</title><desc>H composed with A sub P equals A sub Q composed with H, and H composed with B sub P equals B sub Q composed with H.</desc><rect x="1" y="1" width="638" height="188" rx="14" fill="#20252c" stroke="#3b434e" stroke-width="2"/><g fill="#e6edf3" font-family="Georgia, Noto Serif, DejaVu Serif, serif"><text x="36" y="76" font-size="43">H ∘ A<tspan baseline-shift="sub" font-size="27">P</tspan> = A<tspan baseline-shift="sub" font-size="27">Q</tspan> ∘ H</text><text x="36" y="151" font-size="43">H ∘ B<tspan baseline-shift="sub" font-size="27">P</tspan> = B<tspan baseline-shift="sub" font-size="27">Q</tspan> ∘ H</text></g></svg>
