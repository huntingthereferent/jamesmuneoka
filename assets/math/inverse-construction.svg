<svg xmlns="http://www.w3.org/2000/svg" width="640" height="184" viewBox="0 0 640 184" role="img" aria-label="Inverse construction equation"><title>Inverse construction equation</title><desc>Inv sub F of R equals the set of laws W in F satisfying R.</desc><rect x="1" y="1" width="638" height="182" rx="14" fill="#20252c" stroke="#3b434e" stroke-width="2"/><g fill="#e6edf3" font-family="Georgia, Noto Serif, DejaVu Serif, serif"><text x="34" y="78" font-size="40">Inv<tspan font-size="25" baseline-shift="sub" font-style="italic">F</tspan>(R) = { W ∈ <tspan font-style="italic">F</tspan> :</text><text x="35" y="143" font-size="40"><tspan font-style="italic">W</tspan> satisfies <tspan font-style="italic">R</tspan> }</text></g></svg>
