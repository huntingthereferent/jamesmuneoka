<svg xmlns="http://www.w3.org/2000/svg" width="640" height="152" viewBox="0 0 640 152" role="img" aria-label="Restricted B-action conjugacy equation"><title>Restricted B-action conjugacy equation</title><desc>F composed with B sub left equals B sub right composed with F.</desc><rect x="1" y="1" width="638" height="150" rx="14" fill="#20252c" stroke="#3b434e" stroke-width="2"/><g fill="#e6edf3" font-family="Georgia, Noto Serif, DejaVu Serif, serif"><text x="29" y="93" font-size="40">F ∘ B<tspan baseline-shift="sub" font-size="22">left</tspan> = B<tspan baseline-shift="sub" font-size="22">right</tspan> ∘ F</text></g></svg>
